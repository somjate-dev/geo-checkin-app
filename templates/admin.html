<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบการเช็คอิน (Admin Dashboard)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .thumb-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
        .thumb-img:hover { transform: scale(1.1); }
        #adminMap { height: 350px; border-radius: 12px; }
        .user-checklist { max-height: 150px; overflow-y: auto; border: 1px solid #dee2e6; padding: 10px; border-radius: 8px; background: #fff; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar สลับเมนู -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-shield-halved text-warning me-2"></i>Admin Panel</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" href="/admin"><i class="fa-solid fa-chart-line me-1"></i>แดชบอร์ด</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/manage"><i class="fa-solid fa-users-gear me-1"></i>จัดการผู้ใช้งาน</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-white">
                <span class="me-3 small"><i class="fa-solid fa-user me-1"></i>{{ username }}</span>
                <a href="/logout" class="btn btn-sm btn-outline-light rounded-pill">ออกจากระบบ</a>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid py-4 px-md-5">
    <!-- แผนที่พิกัดรวม -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card border-0 shadow-sm rounded-4 p-3">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-map me-2 text-primary"></i>ภาพรวมพิกัดการเช็คอินทั้งหมด</h5>
                <div id="adminMap"></div>
            </div>
        </div>
    </div>

    <!-- ฟิลเตอร์การค้นหาและคัดกรองข้อมูลเชิงลึก -->
    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <h5 class="fw-bold mb-3 text-secondary"><i class="fa-solid fa-filter me-2 text-primary"></i>ตัวคัดกรองข้อมูลเชิงลึก (Filters)</h5>
        <form method="GET" action="/admin">
            <div class="row g-3">
                <!-- 1. ค้นหาทั่วไป -->
                <div class="col-lg-4 col-md-6">
                    <label class="form-label small fw-bold text-muted">ค้นหาพิกัด / ข้อความ</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                        <input type="text" name="search" class="form-control" placeholder="ระบุพิกัด, ชื่อ หรือข้อความ..." value="{{ search_query }}">
                    </div>
                </div>

                <!-- 2. ช่วงระยะเวลาระหว่างวันที่ -->
                <div class="col-lg-4 col-md-6">
                    <label class="form-label small fw-bold text-muted">ช่วงวันที่เช็คอิน (เริ่มต้น - สิ้นสุด)</label>
                    <div class="input-group input-group-sm">
                        <input type="date" name="start_date" class="form-control" value="{{ start_date }}">
                        <span class="input-group-text bg-light">ถึง</span>
                        <input type="date" name="end_date" class="form-control" value="{{ end_date }}">
                    </div>
                </div>

                <!-- 3. คัดกรองชื่อพนักงานแบบ Checklist -->
                <div class="col-lg-4 col-12">
                    <label class="form-label small fw-bold text-muted">คัดเลือกรายชื่อพนักงาน (Checklist)</label>
                    <div class="user-checklist">
                        {% for u in users_list %}
                        <div class="form-check form-check-sm mb-1">
                            <input class="form-check-input" type="checkbox" name="selected_users" value="{{ u.username }}" id="chk_{{ u.username }}"
                                   {% if u.username in selected_users %}checked{% endif %}>
                            <label class="form-check-label small" for="chk_{{ u.username }}">
                                {{ u.firstname }} {{ u.lastname }} ({{ u.username }})
                            </label>
                        </div>
                        {% else %}
                        <div class="text-muted small py-2">ไม่มีข้อมูลพนักงาน</div>
                        {% endfor %}
                    </
