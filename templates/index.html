<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คอินระบุพิกัดตำแหน่ง</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet.js CSS (แผนที่ฟรี 100%) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 260px; border-radius: 12px; }
        .preview-img { max-height: 200px; object-fit: cover; border-radius: 12px; display: none; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; color: white; }
    </style>
</head>
<body class="bg-light">

<!-- แถบเมนูด้านบน -->
<nav class="navbar navbar-expand navbar-dark bg-primary px-3 shadow-sm">
    <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-map-location-dot me-2"></i>Smart Check-in</a>
    <div class="ms-auto d-flex align-items-center text-white">
        <span class="me-3 small"><i class="fa-solid fa-user-circle me-1"></i>{{ username }}</span>
        <a href="/logout" class="btn btn-sm btn-outline-light rounded-pill">ออกจากระบบ</a>
    </div>
</nav>

<!-- Loading Overlay สวยงาม -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="text-center">
        <div class="spinner-border text-light mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <h5 id="loadingText">กำลังประมวลผล...</h5>
    </div>
</div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-body p-4">
                    
                    <h5 class="fw-bold mb-3 text-secondary"><i class="fa-solid fa-location-crosshairs text-danger me-2"></i>ตำแหน่งปัจจุบันของคุณ</h5>
                    
                    <!-- ส่วนแสดงสถานะพิกัด -->
                    <div id="gpsStatus" class="alert alert-warning py-2 small text-center mb-3">
                        <i class="fa-solid fa-spinner fa-spin me-2"></i>กำลังค้นหาสัญญาณดาวเทียม GPS...
                    </div>
                    
                    <!-- แผนที่ Interactive Leaflet Map -->
                    <div id="map" class="mb-3 border"></div>
                    
                    <div class="row g-2 mb-3 small text-muted">
                        <div class="col-6">ละติจูด: <b id="latDisplay" class="text-dark">-</b></div>
                        <div class="col-6">ลองจิจูด: <b id="lngDisplay" class="text-dark">-</b></div>
                    </div>

                    <hr class="my-3">

                    <!-- ปุ่มถ่ายรูปผ่านกล้องมือถือ -->
                    <h5 class="fw-bold mb-3 text-secondary"><i class="fa-solid fa-camera text-primary me-2"></i>ถ่ายรูปหลักฐาน</h5>
                    <div class="text-center mb-3">
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="d-none">
                        <button type="button" id="btnCapture" class="btn btn-outline-primary w-100 py-3 rounded-3 border-2 fw-semibold">
                            <i class="fa-solid fa-camera fa-2x d-block mb-1"></i>แตะเพื่อเปิดกล้องถ่ายรูป
                        </button>
                        <img id="imagePreview" class="preview-img img-fluid mt-3 border w-100 shadow-sm" alt="รูปถ่าย">
                    </div>

                    <!-- ปุ่มกดบันทึกเช็คอิน -->
                    <button type="button" id="btnSubmit" class="btn btn-success w-100 py-3 rounded-pill fw-bold shadow mt-2" disabled>
                        <i class="fa-solid fa-check-circle me-2"></i>ยืนยันการเช็คอิน
                    </button>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts: jQuery, Bootstrap, Leaflet -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
$(document).ready(function() {
    let currentLat = null;
    let currentLng = null;
    let selectedPhoto = null;
    let map = null;
    let marker = null;

    // 1. ตั้งค่าแผนที่เริ่มต้น
    function initMap(lat, lng) {
        if (!map) {
            map = L.map('map').setView([lat, lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            marker = L.marker([lat, lng]).addTo(map).bindPopup("ตำแหน่งของคุณ").openPopup();
        } else {
            map.setView([lat, lng], 16);
            marker.setLatLng([lat, lng]);
        }
    }

    // 2. ดึงพิกัดผ่าน HTML5 Geolocation API
    function fetchLocation() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;

                    $('#latDisplay').text(currentLat.toFixed(6));
                    $('#lngDisplay').text(currentLng.toFixed(6));
                    $('#gpsStatus')
                        .removeClass('alert-warning alert-danger')
                        .addClass('alert-success')
                        .html('<i class="fa-solid fa-circle-check me-2"></i>พบพิกัดตำแหน่งเรียบร้อยแล้ว');

                    initMap(currentLat, currentLng);
                    checkReadyState();
                },
                function(error) {
                    let msg = "ไม่สามารถเข้าถึงตำแหน่งได้";
                    if (error.code === error.PERMISSION_DENIED) msg = "กรุณากด 'อนุญาต' (Allow) สิทธิ์ระบุตำแหน่งในเบราว์เซอร์";
                    $('#gpsStatus').removeClass('alert-warning alert-success').addClass('alert-danger').html('<i class="fa-solid fa-triangle-exclamation me-2"></i>' + msg);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        } else {
            $('#gpsStatus').text("เบราว์เซอร์นี้ไม่รองรับ Geolocation");
        }
    }

    fetchLocation();

    // 3. จัดการเปิดกล้องและ Preview รูป
    $('#btnCapture').on('click', function() {
        $('#cameraInput').click();
    });

    $('#cameraInput').on('change', function(e) {
        if (this.files && this.files[0]) {
            selectedPhoto = this.files[0];
            let reader = new FileReader();
            reader.onload = function(e) {
                $('#imagePreview').attr('src', e.target.result).fadeIn();
                $('#btnCapture').html('<i class="fa-solid fa-rotate-right me-2"></i>ถ่ายรูปใหม่');
            };
            reader.readAsDataURL(selectedPhoto);
            checkReadyState();
        }
    });

    // ตรวจสอบความพร้อมก่อนเปิดปุ่มบันทึก
    function checkReadyState() {
        if (currentLat && currentLng && selectedPhoto) {
            $('#btnSubmit').prop('disabled', false);
        }
    }

    // 4. ส่งข้อมูลเข้าเซิร์ฟเวอร์ผ่าน jQuery AJAX (FormData)
    $('#btnSubmit').on('click', function() {
        let formData = new FormData();
        formData.append('latitude', currentLat);
        formData.append('longitude', currentLng);
        formData.append('photo', selectedPhoto);

        $('#loadingOverlay').css('display', 'flex');

        $.ajax({
            url: '/api/checkin',
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            success: function(response) {
                $('#loadingOverlay').hide();
                Swal.fire({
                    icon: 'success',
                    title: 'สำเร็จ!',
                    text: response.message,
                    confirmButtonText: 'ตกลง'
                }).then(() => {
                    location.reload();
                });
            },
            error: function(xhr) {
                $('#loadingOverlay').hide();
                let err = xhr.responseJSON ? xhr.responseJSON.message : "เกิดข้อผิดพลาดในการส่งข้อมูล";
                Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: err });
            }
        });
    });
});
</script>
</body>
</html>
