<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Geolocation Check-in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { border-radius: 1.25rem; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-md-5">
            <div class="card login-card p-4 bg-white border-0">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-location-dot fa-3x text-primary mb-2"></i>
                    <h3 class="fw-bold">ระบบเช็คอินพิกัด</h3>
                    <p class="text-muted small">เข้าสู่ระบบเพื่อบันทึกพิกัดและรูปถ่าย</p>
                </div>
                {% if error %}
                <div class="alert alert-danger py-2 small text-center">{{ error }}</div>
                {% endif %}
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">ชื่อผู้ใช้งาน</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="username" class="form-control" required placeholder="เช่น staff01 หรือ admin">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">รหัสผ่าน</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" required placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill">
                        เข้าสู่ระบบ <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                    </button>
                </form>
                <div class="mt-4 text-center text-muted small">
                    บัญชีทดสอบ: <code>staff01 / pass123</code> หรือ <code>admin / admin123</code>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
